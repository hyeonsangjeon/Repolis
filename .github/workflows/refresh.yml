name: Refresh Repolis data

on:
  schedule:
    - cron: "17 18 * * *" # daily ~03:17 KST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repolis
        uses: actions/checkout@v4

      - name: Checkout github-traffic-monitor (read-only)
        uses: actions/checkout@v4
        with:
          repository: hyeonsangjeon/github-traffic-monitor
          token: ${{ secrets.GH_PAT }}
          path: github-traffic-monitor

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build repos.json
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GTM_DIR: github-traffic-monitor
          REPO_OWNER: hyeonsangjeon
        run: python3 scripts/build_repos.py

      - name: Commit if changed
        run: |
          if ! git diff --quiet -- repos.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add repos.json
            git commit -m "chore: refresh Repolis data ($(date -u +%F))"
            git push
          else
            echo "repos.json unchanged"
          fi
