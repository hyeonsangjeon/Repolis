<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" role="img" aria-label="크로노스 의회의 판결 흐름: 세 현자가 증언·반론하고, 의장 크로노스가 시간으로 판결한다. 구경(Ambient)은 공짜·결정적, 라이브 토론은 가드로 보호되는 유료 LLM">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060b1c"/>
      <stop offset="0.55" stop-color="#0c1430"/>
      <stop offset="1" stop-color="#131d40"/>
    </linearGradient>
    <radialGradient id="milky" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6e7bd8" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#3a4790" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0c1430" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kbFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16244e"/><stop offset="1" stop-color="#101b3c"/>
    </linearGradient>
    <linearGradient id="genFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2440"/><stop offset="1" stop-color="#1a1733"/>
    </linearGradient>
    <linearGradient id="goldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241f33"/><stop offset="1" stop-color="#15182f"/>
    </linearGradient>
    <radialGradient id="starGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#ffe6a8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffe6a8" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrG" markerWidth="11" markerHeight="11" refX="7.5" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 Z" fill="#ffd89a"/></marker>
    <marker id="arrW" markerWidth="11" markerHeight="11" refX="7.5" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 Z" fill="#cfe0ff"/></marker>
    <marker id="arrV" markerWidth="11" markerHeight="11" refX="7.5" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 Z" fill="#7fe39a"/></marker>
  </defs>

  <rect width="1200" height="760" fill="url(#sky)"/>
  <!-- milky way band -->
  <g transform="rotate(-24 600 300)" opacity="0.9"><ellipse cx="600" cy="300" rx="760" ry="120" fill="url(#milky)"/></g>

  <!-- stars -->
  <g fill="#fff">
    <circle cx="80" cy="70" r="1.4" opacity="0.8"/><circle cx="170" cy="130" r="1" opacity="0.6"/>
    <circle cx="300" cy="60" r="1.2" opacity="0.7"/><circle cx="430" cy="110" r="0.9" opacity="0.5"/>
    <circle cx="560" cy="70" r="1.5" opacity="0.85"/><circle cx="690" cy="120" r="1" opacity="0.6"/>
    <circle cx="820" cy="60" r="1.2" opacity="0.7"/><circle cx="960" cy="100" r="1.4" opacity="0.8"/>
    <circle cx="1080" cy="64" r="1" opacity="0.6"/><circle cx="1140" cy="150" r="1.3" opacity="0.75"/>
    <circle cx="40" cy="240" r="1.1" opacity="0.6"/><circle cx="150" cy="330" r="1.3" opacity="0.7"/>
    <circle cx="1160" cy="320" r="1.2" opacity="0.7"/><circle cx="1100" cy="430" r="1" opacity="0.55"/>
    <circle cx="60" cy="520" r="1.3" opacity="0.7"/><circle cx="200" cy="640" r="1.1" opacity="0.6"/>
    <circle cx="360" cy="700" r="1.2" opacity="0.65"/><circle cx="520" cy="680" r="0.9" opacity="0.5"/>
    <circle cx="700" cy="710" r="1.3" opacity="0.7"/><circle cx="880" cy="690" r="1" opacity="0.55"/>
    <circle cx="1030" cy="700" r="1.2" opacity="0.65"/><circle cx="1150" cy="640" r="1.1" opacity="0.6"/>
    <circle cx="1170" cy="500" r="1" opacity="0.55"/><circle cx="30" cy="430" r="1" opacity="0.55"/>
  </g>
  <!-- glint stars -->
  <g>
    <circle cx="240" cy="92" r="22" fill="url(#starGlow)"/><circle cx="240" cy="92" r="1.8" fill="#fff"/>
    <circle cx="1012" cy="118" r="20" fill="url(#starGlow)"/><circle cx="1012" cy="118" r="1.6" fill="#fff"/>
    <circle cx="118" cy="612" r="18" fill="url(#starGlow)"/><circle cx="118" cy="612" r="1.5" fill="#fff"/>
    <circle cx="804" cy="652" r="20" fill="url(#starGlow)"/><circle cx="804" cy="652" r="1.6" fill="#fff"/>
  </g>

  <!-- header -->
  <text x="60" y="58" fill="#f3f7ff" font-size="32" font-weight="700">⏳ 크로노스 의회는 어떻게 판결하는가</text>
  <text x="60" y="90" fill="#9fb0d0" font-size="16">세 현자가 <tspan fill="#8fe0a0">문서 vs 코드</tspan>로 다투면 — 의장 <tspan fill="#ffe2ad">크로노스</tspan>가 <tspan fill="#ffd89a">시간</tspan>(가장 최신의 살아있는 소스)으로 판결을 내린다</text>
  <text x="1140" y="58" text-anchor="end" fill="#5f6f96" font-size="14" font-style="italic">Repolis · 크로노폴리스</text>

  <!-- ===== Question ===== -->
  <g filter="url(#soft)">
    <rect x="44" y="180" width="168" height="150" rx="16" fill="#131d3d" stroke="#cfe0ff" stroke-width="1.5" stroke-opacity="0.5"/>
  </g>
  <text x="128" y="228" text-anchor="middle" font-size="28">⚖️</text>
  <text x="128" y="262" text-anchor="middle" fill="#eaf1ff" font-size="16" font-weight="600">질문 하나</text>
  <text x="128" y="283" text-anchor="middle" fill="#9fb0d0" font-size="12">개발·AI · 문서 vs 코드</text>
  <rect x="54" y="296" width="148" height="26" rx="8" fill="#1d2747" stroke="#3a4a72" stroke-opacity="0.6"/>
  <text x="128" y="313" text-anchor="middle" fill="#b9c6e8" font-size="10.5">.dict() → .model_dump()?</text>

  <!-- ===== The Council (3 sages) ===== -->
  <g filter="url(#soft)">
    <rect x="252" y="150" width="332" height="210" rx="18" fill="url(#genFill)" stroke="#b9a6d8" stroke-width="1.7" stroke-opacity="0.6"/>
  </g>
  <text x="272" y="187" font-size="20">🏛️</text>
  <text x="302" y="187" fill="#efeaff" font-size="17" font-weight="700">의회</text>
  <text x="272" y="210" fill="#b3a9cf" font-size="12.5">세 현자가 증언하고, 서로 반론한다 ⚔️</text>
  <g font-weight="600">
    <!-- 올드독 -->
    <rect x="258" y="228" width="104" height="122" rx="11" fill="#241d33" stroke="#c79a5b" stroke-opacity="0.7"/>
    <text x="310" y="258" text-anchor="middle" font-size="18">📜</text>
    <text x="310" y="279" text-anchor="middle" fill="#e0c190" font-size="11.5">올드독</text>
    <text x="310" y="294" text-anchor="middle" fill="#9a8fb5" font-weight="400" font-size="9.5">낡은 문서</text>
    <line x1="270" y1="304" x2="350" y2="304" stroke="#c79a5b" stroke-opacity="0.3"/>
    <text x="310" y="322" text-anchor="middle" fill="#cdbfa0" font-weight="400" font-size="10.5">.dict()</text>
    <text x="310" y="339" text-anchor="middle" fill="#8a7fa5" font-weight="400" font-size="9.5">2025 · "늘 그랬지"</text>
    <!-- 코드짱 -->
    <rect x="366" y="228" width="104" height="122" rx="11" fill="#1b2c25" stroke="#5bbf73" stroke-opacity="0.75"/>
    <text x="418" y="258" text-anchor="middle" font-size="18">🌿</text>
    <text x="418" y="279" text-anchor="middle" fill="#8fe0a0" font-size="11.5">코드짱</text>
    <text x="418" y="294" text-anchor="middle" fill="#86b596" font-weight="400" font-size="9.5">살아있는 소스</text>
    <line x1="378" y1="304" x2="458" y2="304" stroke="#5bbf73" stroke-opacity="0.3"/>
    <text x="418" y="322" text-anchor="middle" fill="#bfe9c8" font-weight="400" font-size="10.5">.model_dump()</text>
    <text x="418" y="339" text-anchor="middle" fill="#7fa98c" font-weight="400" font-size="9.5">2026 · 소스 기준</text>
    <!-- 썰풀이 -->
    <rect x="474" y="228" width="104" height="122" rx="11" fill="#1b2540" stroke="#7aa7d8" stroke-opacity="0.7"/>
    <text x="526" y="258" text-anchor="middle" font-size="18">🌀</text>
    <text x="526" y="279" text-anchor="middle" fill="#a8c8f0" font-size="11.5">썰풀이</text>
    <text x="526" y="294" text-anchor="middle" fill="#8f9fc0" font-weight="400" font-size="9.5">커뮤니티</text>
    <line x1="486" y1="304" x2="566" y2="304" stroke="#7aa7d8" stroke-opacity="0.3"/>
    <text x="526" y="322" text-anchor="middle" fill="#bcd0ee" font-weight="400" font-size="10.5">여론 따라</text>
    <text x="526" y="339" text-anchor="middle" fill="#7f8fb5" font-weight="400" font-size="9.5">보통 문서 편</text>
  </g>

  <!-- ===== KRONOS weighs time ===== -->
  <g filter="url(#soft)">
    <rect x="644" y="150" width="238" height="210" rx="18" fill="url(#goldFill)" stroke="#e8c45a" stroke-width="1.8" stroke-opacity="0.75"/>
  </g>
  <text x="664" y="190" font-size="22" filter="url(#glow)">⏳</text>
  <text x="696" y="187" fill="#ffe9c4" font-size="17" font-weight="700">크로노스</text>
  <text x="664" y="211" fill="#d8cfa0" font-size="12">소스 × 최신성으로 주장을 저울질:</text>
  <!-- priority bars -->
  <g font-size="10.5">
    <text x="664" y="250" font-size="13">🌿</text>
    <text x="684" y="250" fill="#8fe0a0" font-weight="600">살아있는 소스</text>
    <rect x="772" y="241" width="84" height="9" rx="4.5" fill="#5bbf73"/>
    <text x="664" y="278" font-size="13">📜</text>
    <text x="684" y="278" fill="#e0c190" font-weight="600">낡은 문서</text>
    <rect x="772" y="269" width="42" height="9" rx="4.5" fill="#c79a5b"/>
    <text x="664" y="306" font-size="13">🌀</text>
    <text x="684" y="306" fill="#a8c8f0" font-weight="600">커뮤니티</text>
    <rect x="772" y="297" width="28" height="9" rx="4.5" fill="#7aa7d8"/>
  </g>
  <text x="664" y="334" fill="#ffd89a" font-size="11" font-style="italic">↳ 가장 최신의 살아있는 소스가 이긴다 —</text>
  <text x="664" y="349" fill="#ffd89a" font-size="11" font-style="italic">다수결마저 뒤집으면서.</text>

  <!-- ===== Verdict + signature ===== -->
  <g filter="url(#soft)">
    <rect x="930" y="150" width="226" height="210" rx="18" fill="url(#goldFill)" stroke="#e8c45a" stroke-width="2.2" stroke-opacity="0.85"/>
  </g>
  <text x="950" y="190" font-size="20">✅</text>
  <text x="982" y="187" fill="#ffe9c4" font-size="17" font-weight="700">판결</text>
  <text x="1043" y="234" text-anchor="middle" fill="#8fe0a0" font-size="20" font-weight="700">.model_dump()</text>
  <text x="1043" y="258" text-anchor="middle" fill="#9fb0d0" font-size="12.5">신뢰도 0.85 · 다수결 역전</text>
  <line x1="948" y1="276" x2="1138" y2="276" stroke="#e8c45a" stroke-opacity="0.3"/>
  <text x="1043" y="304" text-anchor="middle" fill="#ffe2ad" font-size="13" font-style="italic">"표는 셋, 허나 시간은</text>
  <text x="1043" y="322" text-anchor="middle" fill="#ffe2ad" font-size="13" font-style="italic">하나를 가리킨다."</text>
  <text x="1043" y="344" text-anchor="middle" fill="#8a7fa5" font-size="10">⏳ 시그니처 S1 · S1–S9 중 하나</text>

  <!-- arrows: Question -> Council -> KRONOS -> Verdict -->
  <path d="M212,255 L250,255" fill="none" stroke="#cfe0ff" stroke-width="2.2" marker-end="url(#arrW)"/>
  <text x="231" y="246" text-anchor="middle" fill="#cfe0ff" font-size="11">묻고</text>
  <path d="M584,255 L642,255" fill="none" stroke="#cfe0ff" stroke-width="2.2" marker-end="url(#arrW)"/>
  <text x="613" y="246" text-anchor="middle" fill="#cfe0ff" font-size="10.5">증언</text>
  <path d="M882,255 L928,255" fill="none" stroke="#ffd89a" stroke-width="2.4" marker-end="url(#arrV)"/>
  <text x="905" y="246" text-anchor="middle" fill="#ffd89a" font-size="10.5">판결</text>

  <!-- ===== emphasis strip ===== -->
  <rect x="44" y="392" width="1112" height="40" rx="12" fill="#0f1736" stroke="#2a3a6a" stroke-opacity="0.55"/>
  <text x="600" y="417" text-anchor="middle" fill="#cfd9f0" font-size="15" font-weight="600">🎭 토론은 연극 &#160;·&#160; ⚖️ 판결은 언제나 수학 — <tspan fill="#8fe0a0">결정적</tspan>, <tspan fill="#ffe2ad">바이트까지 동일</tspan>, 감사 가능</text>

  <!-- ===== Ambient (free) ===== -->
  <g filter="url(#soft)">
    <rect x="44" y="452" width="548" height="156" rx="18" fill="url(#kbFill)" stroke="#8fb6ff" stroke-width="1.8" stroke-opacity="0.7"/>
  </g>
  <text x="66" y="490" font-size="20">👁️</text>
  <text x="96" y="490" fill="#dce8ff" font-size="16.5" font-weight="700">구경 — 다가가서 지켜보기</text>
  <text x="66" y="516" fill="#9fb0d0" font-size="13">공짜 · LLM 0 · 완전 결정적 · 늘 켜짐.</text>
  <text x="66" y="537" fill="#9fb0d0" font-size="13">마을에서 보이는 토론 말풍선은 엔진이 미리 계산 —</text>
  <text x="66" y="556" fill="#9fb0d0" font-size="13">같은 입력 → 매번 바이트까지 동일.</text>
  <g font-size="11" font-weight="600">
    <rect x="66" y="572" width="78" height="24" rx="8" fill="#1a2950" stroke="#8fb6ff" stroke-opacity="0.45"/>
    <text x="105" y="588" text-anchor="middle" fill="#bcd2ff">비용 $0</text>
    <rect x="150" y="572" width="118" height="24" rx="8" fill="#1a2950" stroke="#8fb6ff" stroke-opacity="0.45"/>
    <text x="209" y="588" text-anchor="middle" fill="#bcd2ff">테스트 52 통과</text>
    <rect x="274" y="572" width="98" height="24" rx="8" fill="#1a2950" stroke="#8fb6ff" stroke-opacity="0.45"/>
    <text x="323" y="588" text-anchor="middle" fill="#bcd2ff">네트워크 없음</text>
  </g>

  <!-- ===== Live (paid, guarded) ===== -->
  <g filter="url(#soft)">
    <rect x="612" y="452" width="544" height="156" rx="18" fill="url(#genFill)" stroke="#ffd89a" stroke-width="1.8" stroke-opacity="0.75"/>
  </g>
  <text x="634" y="490" font-size="18">🔴</text>
  <text x="664" y="490" fill="#ffe9c4" font-size="16.5" font-weight="700">라이브 토론 — 실제 LLM</text>
  <text x="634" y="516" fill="#bdb3d6" font-size="13">유료 · 모델이 페르소나로 입담을 쓴다.</text>
  <text x="634" y="537" fill="#bdb3d6" font-size="13">L1–L5로 보호 · 기본값 <tspan fill="#ffd89a">LIVE_ENABLED=false</tspan>.</text>
  <text x="634" y="556" fill="#bdb3d6" font-size="13">키 없으면 → 조용히 구경 모드로. 판결은 엔진이 계산.</text>
  <g font-size="11" font-weight="600">
    <rect x="634" y="572" width="104" height="24" rx="8" fill="#322a4c" stroke="#ffd89a" stroke-opacity="0.45"/>
    <text x="686" y="588" text-anchor="middle" fill="#ffe2ad">L1–L5 가드</text>
    <rect x="744" y="572" width="128" height="24" rx="8" fill="#322a4c" stroke="#ffd89a" stroke-opacity="0.45"/>
    <text x="808" y="588" text-anchor="middle" fill="#ffe2ad">예산 킬스위치 90%</text>
    <rect x="878" y="572" width="126" height="24" rx="8" fill="#322a4c" stroke="#d6b8ff" stroke-opacity="0.45"/>
    <text x="941" y="588" text-anchor="middle" fill="#e2d0ff">쿨다운 · 버스트</text>
  </g>

  <!-- footer legend -->
  <g font-size="12.5">
    <circle cx="64" cy="712" r="6" fill="#5bbf73"/>
    <text x="78" y="716" fill="#9fb0d0">시간 우선 — <tspan fill="#8fe0a0">살아있는 소스</tspan> &gt; <tspan fill="#e0c190">낡은 문서</tspan> &gt; <tspan fill="#a8c8f0">여론</tspan>; 최신이 이긴다</text>
    <circle cx="560" cy="712" r="6" fill="#e8c45a"/>
    <text x="574" y="716" fill="#9fb0d0">판결과 S1–S9 시그니처는 언제나 결정적</text>
    <text x="1140" y="716" text-anchor="end" fill="#5f6f96">기본 0비용 · L1–L5 가드</text>
  </g>
</svg>
